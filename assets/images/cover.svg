<svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- fundo espacial -->
<radialGradient id="space">
<stop offset="0%" stop-color="#1a2340"/>
<stop offset="100%" stop-color="#05070f"/>
</radialGradient>

<!-- brilho estelar -->
<radialGradient id="star4500">
<stop offset="0%" stop-color="#FFE6B3"/>
<stop offset="40%" stop-color="#FFD27A"/>
<stop offset="100%" stop-color="#FFC65C" stop-opacity="0"/>
</radialGradient>

<style>

.title{
font-family:"Montserrat","IBM Plex Sans",sans-serif;
font-weight:600;
font-size:52px;
fill:#FFE6B3;
text-anchor:middle;
letter-spacing:4px;
}

.subtitle{
font-family:"Source Sans 3","Inter",sans-serif;
font-weight:400;
font-size:22px;
fill:#FFD27A;
text-anchor:middle;
letter-spacing:1px;
}

.node{
fill:#FFE6B3;
}

.nodedark{
fill:#F54927;
}

.label{
font-family:"Inter","Source Sans 3",sans-serif;
font-weight:500;
font-size:18px;
fill:#FFE6B3;
text-anchor:middle;
}

.labeldark{
font-family:"Inter","Source Sans 3",sans-serif;
font-weight:600;
font-size:20px;
fill:#F54927;
text-anchor:middle;
}

.orbit{
stroke:#FFD27A;
stroke-width:1.4;
opacity:0.6;
fill:none;
}

.link{
stroke:#FFC65C;
stroke-width:1.2;
opacity:0.7;
}

.web{
stroke:#2b355a;
stroke-width:1;
opacity:0.35;
}

.star{
fill:#FFE6B3;
opacity:0.9;
}

</style>

</defs>

<!-- background -->
<rect width="100%" height="100%" fill="url(#space)"/>

<!-- cosmic web -->
<path d="M80 220 C220 260 360 320 520 280 S820 260 1040 340" class="web"/>
<path d="M140 640 C320 580 480 520 640 560 S880 640 1040 700" class="web"/>
<path d="M240 120 C420 200 560 320 720 260 S940 160 1080 220" class="web"/>
<path d="M120 780 C320 720 520 660 720 700 S920 820 1080 880" class="web"/>
<path d="M60 480 C260 420 420 420 600 460 S920 520 1120 460" class="web"/>

<!-- stars -->
<circle cx="100" cy="120" r="1.5" class="star"/>
<circle cx="900" cy="180" r="1.3" class="star"/>
<circle cx="1050" cy="400" r="1.7" class="star"/>
<circle cx="300" cy="880" r="1.4" class="star"/>
<circle cx="650" cy="900" r="1.2" class="star"/>
<circle cx="800" cy="80" r="1.3" class="star"/>

<!-- title -->
<text x="600" y="90" class="title">PROJETO HERMATHENA</text>
<text x="600" y="130" class="subtitle">
Comunicação Científica do Radiotelescópio BINGO
</text>

<!-- halo central -->
<circle cx="600" cy="470" r="160" fill="url(#star4500)"/>

<!-- orbit -->
<circle cx="600" cy="470" r="280" class="orbit"/>

<!-- Hermathena -->
<circle cx="600" cy="470" r="28" class="node"/>
<text x="600" y="510" class="labeldark">Hermathena</text>

<!-- Via Lactea -->
<circle cx="600" cy="190" r="18" class="node"/>
<text x="600" y="160" class="label">Via Láctea</text>

<!-- Triangulum -->
<circle cx="880" cy="470" r="18" class="node"/>
<text x="880" y="505" class="label">Triangulum</text>

<!-- Andromeda -->
<circle cx="320" cy="470" r="18" class="node"/>
<text x="320" y="505" class="label">Andromeda</text>

<!-- Magellan -->
<line x1="600" y1="500" x2="600" y2="620" class="link"/>
<circle cx="600" cy="640" r="16" class="node"/>
<text x="600" y="675" class="label">Magellan</text>

<!-- BINGO -->
<line x1="600" y1="660" x2="600" y2="780" class="link"/>
<circle cx="600" cy="810" r="24" class="node"/>
<text x="600" y="850" class="label">BINGO</text>

</svg>