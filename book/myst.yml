  - title: Estratégia
    children:
      - file: book/estrategia/educomunicacao.md
      - file: book/estrategia/canais.md

  - title: Operação
    children:
      - file: book/operacao/fase1.md
      - file: book/operacao/cronograma.md

  - title: Financiamento
    children:
      - file: book/financiamento/orcamento.md
      - file: book/financiamento/parceiros.md

  - title: Anexos
    children:
