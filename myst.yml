version: 1
project:
  title: Projeto Hermathena
  subtitle: Comunicação Multimídia do Radiotelescópio BINGO
  authors:
    - Luciano Barosi
  license: CC-BY-4.0
  exclude:
    - README.md
    - convite/
    - notebooks/
    - scripts/
    - destinatarios.md
  exports:
    - format: pdf
      template: plain_latex_book
      engine: playwright
      class: report
      titlepage: true
      number_sections: true
      header-includes:
        - \usepackage{graphicx}
        - \usepackage{fancyhdr}
        - \pagestyle{fancy}
        - \fancyhead[L]{Projeto Hermathena}
        - \fancyhead[R]{Radiotelescópio BINGO}

site:
  template: book-theme
  options:
    css: assets/css/custom.css
    edit-link: false
    favicon: assets/logos/favicon/favicon.ico
    logo: assets/logos/bingo_logo.png

toc:
  - file: book/00_convite.md
  - title: Fundamentos
    children:
      - file: book/01_geral/intro.md
      - file: book/01_geral/ecossistema.md
      - file: book/01_geral/motivacao.md
      - file: book/01_geral/contexto-bingo.md

  - title: Estrutura Organizacional
    children:
      - file: book/02_organizacao/estrutura.md
      - file: book/02_organizacao/nucleos.md

  - title: Estratégia
    children:
      - file: book/03_estrategia/educomunicacao.md
      - file: book/03_estrategia/canais.md

  - title: Operação
    children:
      - file: book/04_operacao/fase1.md
      - file: book/04_operacao/cronograma.md

  - title: Financiamento
    children:
      - file: book/05_financiamento/orcamento.md